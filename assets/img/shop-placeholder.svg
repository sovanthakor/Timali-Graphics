  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <g opacity=".5">
    <rect x="0" y="392" width="800" height="208" fill="#1B1726"/>
    <rect x="40" y="150" width="300" height="242" fill="#221D31" stroke="#453C5E" stroke-width="2"/>
    <rect x="380" y="196" width="380" height="196" fill="#221D31" stroke="#453C5E" stroke-width="2"/>
    <rect x="66" y="180" width="248" height="112" fill="#FBBA00" opacity=".22"/>
